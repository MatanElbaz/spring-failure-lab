id: kafka/offset-committed-before-work-done
area: kafka
symptom:
  - "records missing after a deploy or restart, with no error in the logs"
  - "consumer lag is zero but the work for some records was never done"
signature_logs:
  - "committed offset=200"
  - "dropped-in-queue="
  - "lost="
versions_tested:
  spring-boot: "4.1.1"
  spring-kafka: "4.1.1"
  kafka-clients: "4.2.1"
  testcontainers: "2.0.5"
  kafka-broker-image: "apache/kafka:4.2.1"
  java: "21.0.11"
