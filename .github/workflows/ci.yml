name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linter tests
        run: python3 -m unittest discover -s tests
      - name: Check scenarios
        run: python3 scripts/check_scenarios.py

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run every scenario, broken then fixed
        run: |
          shopt -s nullglob
          for dir in scenarios/*/*/; do
            echo "::group::$dir"
            make -C "$dir" break
            make -C "$dir" fix
            echo "::endgroup::"
          done
