    url: "https://docs.spring.io/spring-kafka/reference/kafka/receiving-messages/ooo-commits.html"
    accessed: "2026-10-03"
  - title: "Spring for Apache Kafka reference: Container Properties"
    url: "https://docs.spring.io/spring-kafka/reference/kafka/container-props.html"
    accessed: "2026-10-03"
  - title: "Apache Kafka 4.2 KafkaConsumer javadoc"
    url: "https://kafka.apache.org/42/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html"
